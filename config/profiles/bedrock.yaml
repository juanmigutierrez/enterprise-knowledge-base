# Recommended model settings (decisions.md D15). Needs AWS credentials in the
# environment; infrastructure is still local unless the aws profile is used.
provider: bedrock
steps:
  t4_chunk:     { option: structure_aware, params: { max_tokens: 400, context_header: model, model: claude-haiku-5-5 } }
  t5_classify:  { option: model_plus_rules, params: { model: claude-haiku-5-5 } }
  t6_entities:  { option: cascade, params: { first: claude-haiku-5-5, escalate_to: claude-sonnet-5-5 } }
  t7_embed:     { option: cohere_embed_v4, params: { dimensions: 1024, dtype: int8 } }
  q1_plan:      { option: rewrite_when_needed, params: { model: claude-haiku-5-5 } }
  q3_retrieve:  { option: hybrid_rrf, params: { rerank: cohere_rerank_3_5, top_k: 5 } }
