# Local version of the architecture (docs/architecture.md §2).
#
#   docker compose up -d                       infrastructure core
#   docker compose --profile models up -d      + Ollama (free local models)
#   docker compose --profile app up -d         + connector, worker, api (once built)
#
# All ports bind to 127.0.0.1 only. No credentials are needed for the core.
# Images are pinned to versions; Dependabot proposes upgrades.

name: ekb

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  image: ekb:local
  env_file:
    - path: .env
      required: false
  environment:
    EKB_PROFILE: ${EKB_PROFILE:-local}
  depends_on:
    kafka: { condition: service_healthy }
    opensearch: { condition: service_healthy }
    dynamodb: { condition: service_started }
  restart: unless-stopped
  profiles: ["app"]

services:
  # ------------------------------------------------ 3 · change log
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly, compacted
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  dynamodb:
    # Document registry, entity store and permission store.
    # TODO: pin to a version tag or digest after the first pull.
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["127.0.0.1:8000:8000"]

  # ------------------------------------------------ 5 · knowledge stores
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"        # local only; production uses IAM + fine-grained access
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    ports: ["127.0.0.1:9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 18

  # ------------------------------------------------ models (optional)
  ollama:
    image: ollama/ollama:0.40.16
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]
    profiles: ["models"]

  # ------------------------------------------------ our services (one image)
  connector:
    <<: *app
    command: ["connect"]

  worker:
    <<: *app
    command: ["worker"]

  api:
    <<: *app
    command: ["api"]
    ports: ["127.0.0.1:8080:8080"]

  # Added as the plan progresses (docs/plan.md §4.2), each behind a profile:
  #   sources:        mock-docs, mock-hr-api, hr-db (Postgres)      -> profile "sources"
  #   full:           seaweedfs, keycloak, debezium, neo4j, duckdb  -> profile "full"
  #   observability:  otel-collector, jaeger, prometheus, grafana   -> profile "observability"

volumes:
  opensearch-data:
  ollama-models:
