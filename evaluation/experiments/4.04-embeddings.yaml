# Option card 4.4 · Embeddings (T7). One file per experiment; the runner reads it.
card: "4.4"
step: t7_embed
question: Which embedding model gives the best retrieval on our multilingual HR corpus, per dollar?

dataset: golden_v1            # evaluation/datasets/golden_v1.jsonl (hold-out excluded)
corpus: hr_synthetic_v1

# Everything except the step under test is fixed, so differences come from the option.
fixed:
  t4_chunk:    { option: structure_aware, params: { max_tokens: 400 } }
  q3_retrieve: { option: hybrid_rrf, params: { rerank: none, top_k: 10 } }

# Since S10, T7's option is `model` for every real model: what changes between runs is
# the model gateway's `embed` route (one model per run: an embedding task has no
# failover) and that model's params. `route` names it; the runner (S18) sets it.
options:
  - { option: model, route: "ollama:bge-m3" }
  - { option: model, route: "bedrock:cohere.embed-v4:0",
      params: { model_kwargs: { output_dimension: 1024, embedding_types: [float] } } }
  - { option: model, route: "bedrock:cohere.embed-v4:0",
      params: { model_kwargs: { output_dimension: 1024, embedding_types: [int8] } } }
  - { option: model, route: "bedrock:amazon.titan-embed-text-v2:0",
      params: { model_kwargs: { dimensions: 1024 } } }

gates:                        # pass/fail before any score is compared
  leakage_rate: 0
  deleted_content_rate: 0

primary_metric: recall@10
secondary_metrics: [mrr@10, hit@5, cost_per_1k_chunks_usd, p95_latency_ms]
decision_rule: cheapest option within 2 points of the best primary metric (paired bootstrap CI)
max_spend_usd: 2
