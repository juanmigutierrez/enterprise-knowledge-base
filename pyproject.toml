[project]
name = "ekb"
version = "0.1.0"
description = "Enterprise knowledge base for AI agents: connectors, change log, processing pipeline, knowledge stores and an MCP access layer."
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies are added per step as each option is implemented
# (e.g. confluent-kafka, opensearch-py, boto3, docling). Heavy, optional
# ones go into [project.optional-dependencies] so the base image stays small.
dependencies = [
  # The webhook receiver (S2), and later the inspector and Knowledge API, are HTTP services.
  "fastapi>=0.115",
  "httpx>=0.27",
  # Model gateway (S7): LangChain chat models for the free-tier providers (D15).
  # Only ekb.platform.gateway.options.langchain imports them; steps call the gateway.
  "filelock>=4.3",
  "langchain-core>=1.8",
  "langchain-google-genai>=4.5",
  "langchain-groq>=1.2",
  "langchain-mistralai>=1.2",
  "langchain-openrouter>=0.3",
  # T3 (S5): CommonMark + tables for the docs tool's Markdown pages.
  "markdown-it-py>=4.0",
  # Knowledge API (S15): the official MCP SDK, for the server and the demo's client (D9).
  "mcp>=2.3",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  # Model gateway (S7): free quotas reset at midnight in the provider's time zone,
  # and Windows has no time-zone database of its own.
  "tzdata>=2025.1",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Local models (S7), only on a machine that can run them: `uv sync --extra ollama`.
ollama = ["langchain-ollama>=1.2"]
# Real infrastructure (S17), behind the same ports as the in-memory options. Each option
# imports its library only when it is built, so `ekb` runs without them. The dev group
# installs all three; the image takes them through --build-arg EXTRAS.
kafka = ["confluent-kafka>=2.16"]           # bus: kafka
search = ["opensearch-py>=3.2"]             # search: opensearch
aws = ["boto3>=1.44"]                       # DynamoDB Local and the S3 API (SeaweedFS)
# Later:
# bedrock  = ["langchain-aws"]   # the production design's models (D15)
# docling  = ["docling>=2.0"]

[project.scripts]
ekb = "ekb.app.cli:app"
ekb-eval = "ekb.evaluation.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
  # S17: the real infrastructure's clients, so tests and type checks see them, and
  # moto, which answers DynamoDB and S3 calls in process (no Docker in unit tests).
  "ekb[kafka,search,aws]",
  "moto[dynamodb,s3]>=5.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekb"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "sources", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM", "C4",     # simplifications
  "RUF",           # ruff-specific
  "S",             # bandit security checks
  "PT",            # pytest style
  "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "sources", "agents", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3, botocore and moto ship no type hints. ekb.platform.aws types the calls it makes
# with its own protocols, so nothing untyped leaks out of it.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is on the path so tests can import the mock sources (sources/).
pythonpath = ["."]
# Integration, end-to-end and experiment tests run only when asked for (S17): a plain
# `uv run pytest` needs no Docker; `uv run pytest -m integration` overrides this.
addopts = '-ra --strict-markers -m "not integration and not e2e and not eval"'
markers = [
  "integration: needs the Docker Compose infrastructure (make up)",
  "e2e: full scenario through the MCP access layer",
  "eval: runs an option experiment; may call paid models",
]

[tool.coverage.run]
source = ["ekb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

# ---------------------------------------------------------------- import-linter
# These contracts make the folder layout enforceable, not just a convention.
# CI fails if code reaches across layers or if one pipeline step imports another.
[tool.importlinter]
root_package = "ekb"
# Lets the contract below see imports of packages outside ekb, such as the mocks.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The product never imports the mock sources; it reaches them over the network"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["sources"]

[[tool.importlinter.contracts]]
name = "The product never imports the agents; they reach it over MCP (S15)"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["agents"]

[[tool.importlinter.contracts]]
name = "Layers: evaluation > entry points > pipeline stages > infrastructure > platform > contracts"
type = "layers"
layers = [
  "ekb.evaluation",
  "ekb.app",
  "ekb.connect | ekb.process | ekb.access | ekb.operate",
  "ekb.changelog | ekb.stores",
  "ekb.platform",
  "ekb.contracts",
]

[[tool.importlinter.contracts]]
name = "Processing steps T2-T8 are independent; only the pipeline wires them together"
type = "independence"
modules = [
  "ekb.process.t2_diff",
  "ekb.process.t3_parse",
  "ekb.process.t4_chunk",
  "ekb.process.t5_classify",
  "ekb.process.t6_entities",
  "ekb.process.t7_embed",
  "ekb.process.t8_permissions",
]

[[tool.importlinter.contracts]]
name = "Query steps Q1-Q4 and the answer writer are independent; only the app wires them together"
type = "independence"
modules = [
  "ekb.access.query.q1_plan",
  "ekb.access.query.q2_prefilter",
  "ekb.access.query.q3_retrieve",
  "ekb.access.query.q4_postcheck",
  "ekb.access.answer",
]

[[tool.importlinter.contracts]]
name = "Knowledge stores are independent of each other"
type = "independence"
modules = [
  "ekb.stores.search",
  "ekb.stores.entities",
  "ekb.stores.metrics",
  "ekb.stores.policies",
  "ekb.stores.permissions",
]


[[tool.importlinter.contracts]]
name = "Connector options can share helpers and cannot depend on sibling options"
type = "independence"
modules = ["ekb.connect.options.*"]

[[tool.importlinter.contracts]]
name = "Only the Kafka adapter imports confluent-kafka (S17)"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["confluent_kafka"]
ignore_imports = ["ekb.changelog.bus.kafka -> confluent_kafka"]

[[tool.importlinter.contracts]]
name = "Only ekb.platform.aws imports boto3 and botocore (S17)"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["boto3", "botocore"]
ignore_imports = ["ekb.platform.aws -> boto3", "ekb.platform.aws -> botocore"]

[[tool.importlinter.contracts]]
name = "Only the OpenSearch search store imports opensearch-py (S17)"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["opensearchpy"]
ignore_imports = ["ekb.stores.search.options.opensearch -> opensearchpy"]

[[tool.importlinter.contracts]]
name = "Only the gateway's LangChain option imports LangChain; everything else calls the gateway (S7)"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["langchain_core"]
ignore_imports = ["ekb.platform.gateway.options.langchain -> langchain_core"]
