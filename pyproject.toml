[project]
name = "ekb"
version = "0.1.0"
description = "Enterprise knowledge base for AI agents: connectors, change log, processing pipeline, knowledge stores and an MCP access layer."
readme = "README.md"
requires-python = ">=3.13"
# Runtime dependencies are added per step as each option is implemented
# (e.g. confluent-kafka, opensearch-py, boto3, docling). Heavy, optional
# ones go into [project.optional-dependencies] so the base image stays small.
dependencies = [
  # The webhook receiver (S2), and later the inspector and Knowledge API, are HTTP services.
  "fastapi>=0.115",
  "httpx>=0.27",
  # T3 (S5): CommonMark + tables for the docs tool's Markdown pages.
  "markdown-it-py>=4.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Filled in as options are implemented. Example:
# kafka    = ["confluent-kafka>=2.6"]
# search   = ["opensearch-py>=3.0"]
# aws      = ["boto3>=1.35"]
# docling  = ["docling>=2.0"]

[project.scripts]
ekb = "ekb.app.cli:app"
ekb-eval = "ekb.evaluation.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "import-linter>=2.1",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekb"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "sources", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM", "C4",     # simplifications
  "RUF",           # ruff-specific
  "S",             # bandit security checks
  "PT",            # pytest style
  "N",             # naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "sources", "tests"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root is on the path so tests can import the mock sources (sources/).
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs the Docker Compose infrastructure (make up)",
  "e2e: full scenario through the MCP access layer",
  "eval: runs an option experiment; may call paid models",
]

[tool.coverage.run]
source = ["ekb"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

# ---------------------------------------------------------------- import-linter
# These contracts make the folder layout enforceable, not just a convention.
# CI fails if code reaches across layers or if one pipeline step imports another.
[tool.importlinter]
root_package = "ekb"
# Lets the contract below see imports of packages outside ekb, such as the mocks.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The product never imports the mock sources; it reaches them over the network"
type = "forbidden"
source_modules = ["ekb"]
forbidden_modules = ["sources"]

[[tool.importlinter.contracts]]
name = "Layers: evaluation > entry points > pipeline stages > infrastructure > platform > contracts"
type = "layers"
layers = [
  "ekb.evaluation",
  "ekb.app",
  "ekb.connect | ekb.process | ekb.access | ekb.operate",
  "ekb.changelog | ekb.stores",
  "ekb.platform",
  "ekb.contracts",
]

[[tool.importlinter.contracts]]
name = "Processing steps T2-T8 are independent; only the pipeline wires them together"
type = "independence"
modules = [
  "ekb.process.t2_diff",
  "ekb.process.t3_parse",
  "ekb.process.t4_chunk",
  "ekb.process.t5_classify",
  "ekb.process.t6_entities",
  "ekb.process.t7_embed",
  "ekb.process.t8_permissions",
]

[[tool.importlinter.contracts]]
name = "Query steps Q1-Q4 are independent; only the query pipeline wires them together"
type = "independence"
modules = [
  "ekb.access.query.q1_plan",
  "ekb.access.query.q2_prefilter",
  "ekb.access.query.q3_retrieve",
  "ekb.access.query.q4_postcheck",
]

[[tool.importlinter.contracts]]
name = "Knowledge stores are independent of each other"
type = "independence"
modules = [
  "ekb.stores.search",
  "ekb.stores.entities",
  "ekb.stores.metrics",
  "ekb.stores.policies",
  "ekb.stores.permissions",
]


[[tool.importlinter.contracts]]
name = "Connector options can share helpers and cannot depend on sibling options"
type = "independence"
modules = ["ekb.connect.options.*"]
